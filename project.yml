name: AppleMusicPresenceLocal

options:
  bundleIdPrefix: dev.layttos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  AppleMusicPresenceLocal:
    type: application
    platform: iOS
    sources:
      - path: AppleMusicPresenceLocal
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        # Identifiant distinct : les deux versions peuvent cohabiter sur l'iPhone.
        PRODUCT_BUNDLE_IDENTIFIER: dev.layttos.AppleMusicPresenceLocal
        PRODUCT_NAME: AppleMusicPresenceLocal
        INFOPLIST_FILE: AppleMusicPresenceLocal/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Personal Team : c'est le champ OU du certificat, pas l'identifiant
        # affiché entre parenthèses dans son nom.
        DEVELOPMENT_TEAM: GD6WJ4NGVD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
